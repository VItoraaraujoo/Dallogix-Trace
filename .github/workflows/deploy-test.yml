name: Deploy test server

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dallogix-trace-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.TEST_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TEST_SERVER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          # GitHub's textarea can preserve CRLF or receive only the Base64 body.
          # Normalize both forms before handing the key to OpenSSH.
          NORMALIZED_KEY=$(printf '%s\n' "$DEPLOY_KEY" | sed -E 's/^\\+//' | tr -d '\r')
          key_header="$(printf '%s' 'LS0tLS1CRUdJTiBPUEVOU1NIIFBSSVZBVEUgS0VZLS0tLS0=' | base64 -d)"
          key_footer="$(printf '%s' 'LS0tLS1FTkQgT1BFTlNTSCBQUklWQVRFIEtFWS0tLS0t' | base64 -d)"
          if printf '%s' "$NORMALIZED_KEY" | grep -q -- 'OPENSSH'; then
            printf '%s\n' "$NORMALIZED_KEY" > "$HOME/.ssh/id_ed25519"
          else
            {
              printf '%s\n' "$key_header"
              printf '%s\n' "$NORMALIZED_KEY" | tr -d '\n '
              printf '%s\n' "$key_footer"
            } > "$HOME/.ssh/id_ed25519"
          fi
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy through the server synchronizer
        env:
          SERVER_HOST: ${{ secrets.TEST_SERVER_HOST }}
          SERVER_USER: ${{ secrets.TEST_SERVER_USER }}
          SERVER_PATH: ${{ secrets.TEST_SERVER_PATH }}
          SERVER_PORT: ${{ secrets.TEST_SERVER_SSH_PORT }}
        run: |
          : "${SERVER_PORT:=22}"
          : "${SERVER_PATH:=/opt/dallogix-trace}"
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cd '$SERVER_PATH' && TRACE_GITHUB_REMOTE=empresa bash scripts/sync_github.sh"
